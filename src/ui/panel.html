<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advanced Search Sort</title>
  </head>
  <body>
    <div class="container">
      <div class="controls">
        <input id="queryInput" type="text" placeholder="Search query..." />
        <button id="searchBtn">Search</button>
      </div>
      <div id="statusLine" class="status">Ready.</div>
      <table>
        <thead>
          <tr>
            <th data-field="relevance">Relevance</th>
            <th data-field="updated">Updated</th>
            <th data-field="created">Created</th>
            <th data-field="title">Title</th>
            <th data-field="notebook">Notebook</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </body>
</html>
